<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Интерактивный дом — Олега Кошевого 2А</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>ул. Олега Кошевого, 2А</h1>
        <p id="headerCount">Заполнено 0 из 88 квартир</p>
    </header>

   <div class="progress-container">
       <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
   </div>
    
    <!-- Переключатель подъездов для мобильных экранов -->
    <div class="tabs-container">
        <button class="tab-btn active" id="tab1" onclick="switchEntrance(1)">1 Подъезд</button>
        <button class="tab-btn" id="tab2" onclick="switchEntrance(2)">2 Подъезд</button>
    </div>

    <div class="building-container">
        <!-- 1 Подъезд -->
        <div class="entrance active" id="entrance1">
            <div class="entrance-title">1 Подъезд</div>
        </div>

        <!-- 2 Подъезд -->
        <div class="entrance" id="entrance2">
            <div class="entrance-title">2 Подъезд</div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="info-panel" id="infoPanel">
        <div class="panel-drag-handle"></div>
        <button class="close-btn" id="closeBtn">&times;</button>
        <div class="panel-header">
            <div class="panel-title" id="panelAptNum">Квартира №--</div>
            <div class="panel-subtitle" id="panelAptMeta">Этаж --, Подъезд --</div>
        </div>
        <div class="residents-list" id="residentsContainer"></div>
    </div>

    <!-- Подключаем изначальный script.js -->
    <script src="script.js"></script>
</body>
</html>
