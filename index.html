<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ул. Олега Кошевого, 2А — Карта жильцов</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description" content="Интерактивная карта жильцов дома на ул. Олега Кошевого, 2А. Присоединяйтесь к соседям!">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta property="og:title" content="ул. Олега Кошевого, 2А — Карта жильцов" />
    <meta property="og:description" content="Интерактивная карта жильцов дома на ул. Олега Кошевого, 2А. Присоединяйтесь к соседям!" />
    <meta property="og:image" content="https://talrash2b.github.io/koshevogo-2a/preview.jpg" />
    <meta property="og:url" content="https://talrash2b.github.io/koshevogo-2a/" />
    <meta property="og:type" content="website" />
</head>
<body>

<header>
    <h1>ул. Олега Кошевого, 2А</h1>
    <div class="progress-wrapper">
        <div class="progress-bar-container">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            <span class="progress-label" id="progressLabel">Заполнено 0 из 88 квартир (0%)</span>
        </div>
    </div>
</header>
    
<div class="tabs-container" id="tabsContainer">
    <div class="tab-slider" id="tabSlider"></div>
    <button class="tab-btn active" id="tab1" onclick="switchEntrance(1)">
        <span class="tab-label">1 Подъезд</span>
        <span class="tab-stats" id="tabStats1">0%</span>
    </button>
    <button class="tab-btn" id="tab2" onclick="switchEntrance(2)">
        <span class="tab-label">2 Подъезд</span>
        <span class="tab-stats" id="tabStats2">0%</span>
    </button>
</div>

<div class="building-container">
    <div class="entrance active" id="entrance1">
        <div class="entrance-title">1 Подъезд</div>
    </div>
    <div class="entrance" id="entrance2">
        <div class="entrance-title">2 Подъезд</div>
    </div>
</div>

<div class="tszh-legend">
    <span class="legend-item"><span class="legend-dot vote-for"></span> За ТСЖ <span id="legendVoteFor" class="legend-count">(0)</span></span>
    <span class="legend-item"><span class="legend-dot vote-against"></span> Против ТСЖ <span id="legendVoteAgainst" class="legend-count">(0)</span></span>
    <span class="legend-item"><span class="legend-dot vote-abstain"></span> Воздержался <span id="legendVoteAbstain" class="legend-count">(0)</span></span>
    <span class="legend-item"><span class="legend-dot attend-yes"></span> УЧАСТВУЕТ в голосовании (кворум) <span id="legendAttendYes" class="legend-count">(0)</span></span>
</div>

<div class="tszh-stats" id="tszhStats">
    <div class="tszh-block">
        <div class="tszh-block-title">Кворум (нужно ≥ 2/3 от 88)</div>
        <div class="tszh-bar">
            <div class="tszh-fill" id="quorumFill" style="width: 0%;"></div>
            <span class="tszh-bar-label" id="quorumLabel">0 / 88 (0%)</span>
        </div>
        <div class="tszh-verdict" id="quorumVerdict">—</div>
    </div>
    <div class="tszh-block">
        <div class="tszh-block-title">Решение ТСЖ (нужно ≥ 2/3 от кворума)</div>
        <div class="tszh-bar">
            <div class="tszh-fill" id="decisionFill" style="width: 0%;"></div>
            <span class="tszh-bar-label" id="decisionLabel">0 / 0 (0%)</span>
        </div>
        <div class="tszh-verdict" id="decisionVerdict">—</div>
    </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="info-panel" id="infoPanel">
    <div class="panel-drag-handle"></div>
    <button class="close-btn" id="closeBtn" type="button">&times;</button>
    <div class="panel-header">
        <div class="panel-title" id="panelAptNum">Квартира №--</div>
        <div class="panel-subtitle" id="panelAptMeta">Этаж --, Подъезд --</div>
    </div>
    <div class="residents-list" id="residentsContainer"></div>
</div>

<script src="script.js"></script>
</body>
</html>
